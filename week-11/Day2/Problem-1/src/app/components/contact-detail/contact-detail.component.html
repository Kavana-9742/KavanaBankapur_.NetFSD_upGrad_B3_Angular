<!-- src/app/components/contact-detail/contact-detail.component.html -->

<div *ngIf="contact">
  <h3>Contact Details</h3>
  <p><b>ID:</b> {{ contact.id }}</p>
  <p><b>Name:</b> {{ contact.name }}</p>
  <p><b>Email:</b> {{ contact.email }}</p>
  <p><b>Phone:</b> {{ contact.phone }}</p>
</div>
